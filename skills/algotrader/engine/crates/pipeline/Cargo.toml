[package]
name = "engine-pipeline"
version = "0.1.0"
edition = "2021"

[dependencies]
engine-types = { path = "../types" }
engine-data = { path = "../data" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
engine-jit = { path = "../jit", optional = true }

[features]
default = []
jit = ["engine-jit"]

[dev-dependencies]
strum = { version = "0.26", features = ["derive"] }
