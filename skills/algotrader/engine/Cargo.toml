[workspace]
resolver = "2"
members = ["crates/types", "crates/data", "crates/signals", "crates/patterns", "crates/pipeline", "crates/jit", "."]

[package]
name = "algotrader-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
engine-types = { path = "crates/types" }
engine-data = { path = "crates/data" }
engine-signals = { path = "crates/signals" }
engine-patterns = { path = "crates/patterns" }
engine-pipeline = { path = "crates/pipeline" }
engine-jit = { path = "crates/jit", optional = true }
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
strum = { version = "0.26", features = ["derive"] }

# Evolution
rand = "0.8"
faer = "0.20"

# Needed by bin/build_cache.rs (standalone binary that does its own parquet I/O)
polars = { version = "0.46", features = ["parquet", "lazy", "dtype-full", "temporal"] }

# Optional pyo3 bridge (behind "python" feature)
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }

[features]
default = []
jit = ["engine-jit", "engine-pipeline/jit"]
python = ["pyo3"]

[lib]
name = "algotrader_engine"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "algotrader-engine"
path = "src/main.rs"

[[bin]]
name = "build-cache"
path = "src/bin/build_cache.rs"

[[bin]]
name = "exp014-bench"
path = "src/bin/exp014_bench.rs"
required-features = ["jit"]

[profile.dev]
opt-level = 1
debug = 1
split-debuginfo = "unpacked"
codegen-units = 256
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
